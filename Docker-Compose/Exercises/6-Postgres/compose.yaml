services:
  frontend:
    image: example-frontend:latest
    ports:
      - 5001:5001

  backend:
    image: example-backend:latest
    ports:
      - 127.0.0.1:8080:8080 
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379 
      - POSTGRES_HOST=db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DATABASE=postgres
    restart: unless-stopped
    

  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres

  redis:
    image: redis